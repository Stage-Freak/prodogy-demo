name: Prodogy Deployment Readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  prodogy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Stage-Freak/prodogy-v2@main
        with:
          fail-on: error
          post-pr-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
